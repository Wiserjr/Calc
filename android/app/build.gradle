plugins { id 'com.android.application' }

def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def signingFile = file(providers.environmentVariable('CALC_SIGNING_PROPERTIES').getOrElse(
        new File(System.getProperty('user.home'), '.codex/signing/calc/release.properties').absolutePath))
def releaseSigning = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseSigning.load(it) }

android {
    namespace = 'br.com.wiserjr.calc'
    compileSdk = 36
    defaultConfig {
        applicationId = 'br.com.wiserjr.calc'
        minSdk = 26
        targetSdk = 36
        versionCode = 21000
        versionName = appVersion
        testInstrumentationRunner = 'br.com.wiserjr.calc.CalculatorInstrumentation'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile = file(releaseSigning.getProperty('storeFile'))
                storePassword = releaseSigning.getProperty('storePassword')
                keyAlias = releaseSigning.getProperty('keyAlias')
                keyPassword = releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig = signingConfigs.release
            minifyEnabled = false
        }
        debug {
            applicationIdSuffix = '.debug'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    testBuildType = providers.gradleProperty('calcTestBuildType').getOrElse('debug')
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/calculatorAssets').get().asFile)
    lint { abortOnError = true; checkReleaseBuilds = true }
}

dependencies { implementation 'androidx.webkit:webkit:1.15.0' }

tasks.register('buildWebCalculator', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build.cjs'
    inputs.files(fileTree('../../src'), file('../../package.json'), file('../../scripts/build.cjs'))
    outputs.files(file('../../calc.html'), file('../../index.html'))
}
tasks.register('prepareCalculatorAssets', Sync) {
    dependsOn 'buildWebCalculator'
    from(file('../../calc.html')) { rename { 'index.html' } }
    into(layout.buildDirectory.dir('generated/calculatorAssets'))
}
tasks.named('preBuild').configure { dependsOn 'prepareCalculatorAssets' }
tasks.configureEach {
    if (name == 'validateSigningRelease' || name == 'packageRelease') doFirst {
        if (!signingFile.exists()) throw new GradleException('Chave de release ausente. Configure CALC_SIGNING_PROPERTIES fora do repositório.')
    }
}
